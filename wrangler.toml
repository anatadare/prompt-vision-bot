name = "prompt-vision-bot"
main = "src/index.js"
compatibility_date = "2026-09-24"

[vars]
JEROUTER_BASE_URL = "https://je.jerouter.web.id/v1"
JEROUTER_MODEL = "grok-4.7"
TEMPERATURE = "0.35"
MAX_IMAGE_BYTES = "7000000"
MIN_PROMPT_WORDS = "250"
MAX_PROMPT_WORDS = "500"
MAX_IMAGES_PER_SCENE = "5"

[[durable_objects.bindings]]
name = "CHAT_SESSION"
class_name = "ChatSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ChatSession"]
